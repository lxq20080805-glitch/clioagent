completion_models:
  default_completion_model:
    model_provider: openai
    model: gpt-4.1
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry:
      type: exponential_backoff

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: text-embedding-3-large
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry:
      type: exponential_backoff

input:
  type: text
  file_pattern: ".*\\.(txt|md)$"

input_storage:
  type: file
  base_dir: "data"

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base

output_storage:
  type: file
  base_dir: "output"

reporting:
  type: file
  base_dir: "logs"

cache:
  type: json
  storage:
    type: file
    base_dir: "cache"

vector_store:
  type: lancedb
  db_uri: "output/lancedb"

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types:
    - historian
    - historical_event
    - historical_evidence
    - interpretation
  max_gleanings: 1

extract_claims:
  enabled: false

embed_text:
  embedding_model_id: default_embedding_model

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model

